<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saran M — Backend Engineer</title>
    <meta name="description" content="Saran M is a backend-focused full stack engineer in Bengaluru building NestJS/TypeScript APIs, BullMQ pipelines, PostgreSQL/Redis services and AWS infrastructure for HIPAA-compliant healthtech." />
    <meta name="author" content="Saran M" />

    <meta property="og:title" content="Saran M — Backend Engineer" />
    <meta property="og:description" content="Backend-focused full stack engineer. NestJS, TypeScript, BullMQ, PostgreSQL, Redis, AWS." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate" type="application/json" href="/api/resume.json" title="Resume (JSON)" />

    <!-- Apply the saved/system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
